name: Android Beta
run-name: Android Beta ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Beta 标签（必须形如 v0.4.0-dev.11-beta.1）
        required: true
        default: v0.4.0-dev.11-beta.1
        type: string

permissions:
  contents: write

concurrency:
  group: android-beta-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/yejian-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release tag
        shell: bash
        run: |
          app_version="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          version_name="${app_version%%+*}"
          expected_prefix="v${version_name}-beta."
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+-beta\.[0-9]+$ ]] || [[ "$RELEASE_TAG" != "$expected_prefix"* ]]; then
            echo "::error::当前版本为 $app_version，标签必须形如 ${expected_prefix}1"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Validate signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::缺少仓库 Secret：$name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build signed APK
        run: flutter build apk --release --no-pub

      - name: Verify APK signature
        shell: bash
        run: |
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::Android SDK 中没有找到 apksigner"
            exit 1
          fi
          "$apksigner_path" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p dist
          apk_name="yejian-${RELEASE_TAG}-android.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$apk_name"
          (cd dist && sha256sum "$apk_name" > "$apk_name.sha256")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: yejian-${{ inputs.tag }}-android
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk_path="dist/yejian-${RELEASE_TAG}-android.apk"
          gh release create "$RELEASE_TAG" \
            "$apk_path#Android APK" \
            "$apk_path.sha256#SHA-256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "页间 ${RELEASE_TAG}" \
            --generate-notes \
            --prerelease \
            --latest=false
