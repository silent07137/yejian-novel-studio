name: 功能建议
description: 提议新功能、交互改进或写作流程优化
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先说明创作中遇到的问题，再描述期望方案。界面参考图可以帮助理解，但请确保有权分享。

  - type: checkboxes
    id: duplicate
    attributes:
      label: 重复检查
      options:
        - label: 我已经搜索过现有 Issue 和路线图，没有找到相同建议
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 功能范围
      options:
        - 书架与作品管理
        - 正文写作与排版
        - 角色与世界观
        - 时间线、思维导图与流程图
        - 导出、备份与工程文件
        - 设置、主题与无障碍
        - Android 平台适配
        - Windows 平台适配
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 当前流程哪里不方便？这个问题在什么创作场景下出现？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请描述入口、操作过程和期望结果
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 可接受的替代方案
      description: 如果完整方案实现成本较高，哪些简化方式也能解决问题？

  - type: textarea
    id: references
    attributes:
      label: 参考资料
      description: 可提供公开链接或不包含私密数据的参考图，并说明希望参考的是哪部分逻辑

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私与版权确认
      options:
        - label: 我确认提交内容不包含私人作品、账号秘密，且参考资料可以公开分享
          required: true
