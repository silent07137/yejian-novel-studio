name: Bug 反馈
description: 报告可以稳定复现的错误、崩溃或数据异常
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请不要上传真实作品、数据库、签名文件、账号令牌或其他私密信息。

  - type: checkboxes
    id: duplicate
    attributes:
      label: 重复检查
      options:
        - label: 我已经搜索过现有 Issue，没有找到相同问题
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: 出现问题的平台
      options:
        - Android
        - Windows
        - Android 和 Windows
        - 暂不确定
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 页间版本
      description: 可在“设置 → 关于应用”中查看
      placeholder: 例如 0.4.0-dev.11 (13)
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 设备与系统
      placeholder: 例如 Pixel 7 / Android 15，或 Windows 11 24H2
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请从启动应用开始，按顺序写出可以重复触发问题的操作
      placeholder: |
        1. 打开……
        2. 点击……
        3. 输入……
        4. 出现问题
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      placeholder: 你认为应用应该发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      placeholder: 实际发生了什么？是否每次都能复现？
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 可粘贴已经检查并移除隐私信息的日志；没有日志可以留空
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可添加不包含私人作品内容的截图、录屏或相关说明

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认提交内容不包含私人正文、真实数据库、密码、密钥或令牌
          required: true
